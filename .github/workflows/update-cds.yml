name: Update sovereign CDS

on:
  schedule:
    # 22:00 UTC de lunes a viernes (tras el cierre). El cron de GitHub puede
    # retrasarse algunos minutos; para datos EOD no importa.
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write         # necesario para que el bot pueda commitear el JSON

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Fetch CDS data
        run: python3 fetch_sovereign_cds.py

      - name: Commit if changed
        run: |
          git config user.name  "cds-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sovereign_cds.json sovereign_cds.csv history.json
          git diff --staged --quiet || git commit -m "data: CDS soberanos $(date -u +%F)"
          git push
